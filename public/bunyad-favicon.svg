<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bunyadGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#0052FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="64" height="64" rx="14" fill="#060B13" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Foundation Monogram "ب" / "B" Architectural Pillars -->
  <path d="M14 44 L50 44" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M22 44 L22 22 L32 16 L42 22 L42 44" stroke="#D4AF37" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <!-- Central Diamond / Dot of Beh (ب) -->
  <circle cx="32" cy="51" r="3.5" fill="#00F0FF" filter="url(#glow)"/>
  <!-- Tech Crossbeams -->
  <line x1="22" y1="28" x2="42" y2="28" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="22" y1="36" x2="42" y2="36" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.7"/>
</svg>
